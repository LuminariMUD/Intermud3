version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /clients/examples
    schedule:
      interval: weekly
    groups:
      python-example-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /clients/javascript
    schedule:
      interval: weekly
    groups:
      javascript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns:
          - "*"
